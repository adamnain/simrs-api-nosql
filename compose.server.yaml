services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simrs-api
    restart: unless-stopped

    env_file:
      - .env

    environment:
      APP_ENV: production

    ports:
      - "127.0.0.1:8000:8000"

    networks:
      - mongodb_network

    mem_limit: 512m
    cpus: 1.0

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  mongodb_network:
    external: true
