services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simrs-api-dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./app:/app/app
    networks:
      - simrs-dev-network

  mongodb:
    image: mongo:8.0
    container_name: simrs-mongodb-dev
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongodb_dev_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${MONGO_ROOT_USER}
        - --password
        - ${MONGO_ROOT_PASSWORD}
        - --authenticationDatabase
        - admin
        - --eval
        - "db.adminCommand('ping').ok"
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simrs-dev-network

volumes:
  mongodb_dev_data:

networks:
  simrs-dev-network:
    driver: bridge